name: Custom Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: custom-debug-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version-file: .github/.java-version

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" --channel=3 --install \
            "platforms;android-37.0" \
            "build-tools;35.0.1" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential ccache cmake glslc gperf \
            libglib2.0-dev libltdl-dev libtool nasm ninja-build pkg-config \
            python3 python3-pip texinfo
          python3 -m pip install --break-system-packages --upgrade meson
          bash llamatik-native/wsl-setup.sh --headers-only

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Build MTL arm64 debug APK
        run: ./gradlew assembleMtlDebug -Pcustom-apk-arm64-only=true --no-daemon --stacktrace --max-workers=2

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: custom-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Update latest-custom tag
        run: |
          git tag --force latest-custom "$GITHUB_SHA"
          git push --force origin refs/tags/latest-custom

      - name: Publish latest-custom release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest-custom
          name: Latest custom debug APK (pre-release)
          body: >-
            Installable debug-key-signed APKs built from `${{ github.sha }}`.
            This build uses a separate `.debug` app ID and is published as a pre-release.
          files: app/build/outputs/apk/**/*.apk
          overwrite_files: true
          prerelease: true
